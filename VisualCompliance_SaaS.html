<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VisualCompliance — Multi-site Visual Standards Platform</title>
<style>

.topright{display:flex;align-items:center;gap:10px}.rel{position:relative}
.iconbtn{border:1px solid var(--line);background:#fff;width:36px;height:36px;border-radius:9px;display:grid;place-items:center;position:relative;color:var(--ink2);flex:none}

.dd{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 18px 40px rgba(16,32,48,.16);z-index:30;display:none;max-height:440px;overflow:auto;padding:6px}

.content{padding:24px 26px 48px;width:100%;max-width:1560px;margin:0 auto}

.pagehead h1{font-size:24px;margin:3px 0 4px;letter-spacing:-.4px}.sub{color:var(--muted);max-width:780px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 13px;border-radius:8px;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:#a9bfd0;background:#fbfcfe}.btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}.btn.primary:hover{background:var(--teal-d)}
.btn.dark{background:var(--nav);border-color:var(--nav);color:#fff}.btn.danger{color:var(--red);border-color:#f0c9cc}.btn.sm{padding:5px 9px;font-size:11.5px;border-radius:7px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.kpi{padding:15px 16px}.kpi.click{cursor:pointer}.kpi.click:hover{border-color:#9fc6cc}
.kpi .label{color:var(--muted);font-size:11.5px}.kpi .value{font-size:26px;font-weight:750;margin:6px 0 2px;letter-spacing:-.6px}.kpi .foot{font-size:11px;color:var(--muted)}
.up{color:var(--green);font-weight:700}.down{color:var(--red);font-weight:700}
.panel{padding:16px 18px}.panelhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}.panelhead h3{font-size:14px;margin:0}

.muted{color:var(--muted)}.small{font-size:11.5px}

.good{background:var(--green2);color:var(--green)}.risk{background:var(--amber2);color:var(--amber)}.bad{background:var(--red2);color:var(--red)}.info{background:var(--blue2);color:var(--blue)}.neutral{background:#eef1f5;color:#5f6e80}.violet{background:var(--violet2);color:var(--violet)}
.chip{padding:4px 9px;border-radius:20px;background:#f0f3f6;color:#5d6c7d;font-size:11px;white-space:nowrap}

.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}

td{padding:11px 12px;border-bottom:1px solid var(--line2);font-size:12.5px;vertical-align:middle}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;flex:none}

.alert:hover{border-color:#cfdbe5}.alertdot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}

.step.done{background:var(--green2);border-color:#cbe9d9;color:var(--green)}.step b{display:block;font-size:12px}
.callout{padding:11px 13px;border-radius:9px;background:#f0f7fb;border:1px solid #dcebf4;color:#365b76;font-size:12px;margin-bottom:13px}

.mini{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:12.5px;align-items:center}.mini:last-child{border:0}.mini>span:first-child{color:var(--muted)}

.tile{padding:13px;background:#f7fafc;border-radius:10px;text-align:center;border:1px solid var(--line2)}.tile strong{font-size:22px;display:block;letter-spacing:-.5px}.tile span{font-size:11px;color:var(--muted)}
.switch{position:relative;width:36px;height:20px;flex:none;display:inline-block}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:#cdd6df;border-radius:20px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked+span{background:var(--teal)}.switch input:checked+span:before{transform:translateX(16px)}
.modalback,.drawerback{position:fixed;inset:0;background:rgba(12,24,38,.45);z-index:40;display:none}
.modalback{align-items:center;justify-content:center;padding:18px}.modalback.show{display:flex}
.modal{width:min(640px,100%);max-height:92vh;display:flex;flex-direction:column;background:#fff;border-radius:14px;box-shadow:0 24px 70px rgba(0,0,0,.25)}.modal.wide{width:min(1180px,100%)}
.mhead{padding:15px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}.mhead h3{margin:0;font-size:15px}
.mbody{padding:18px 20px;overflow:auto}.mfoot{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.x{border:0;background:#f1f4f7;border-radius:8px;width:30px;height:30px;flex:none}
.drawerback.show{display:block}
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(580px,100%);background:#fff;display:flex;flex-direction:column;box-shadow:-20px 0 60px rgba(0,0,0,.18);animation:slide .18s ease-out}
@keyframes slide{from{transform:translateX(40px);opacity:.4}}
.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px}.field label{font-size:11px;color:#5d6c7d;font-weight:700}.field .in{width:100%}.field textarea.in{min-height:72px;resize:vertical}
.span2{grid-column:span 2}.err{border-color:var(--red)!important;box-shadow:0 0 0 3px #fbe3e5!important}
.timeline{border-left:2px solid var(--line);margin:6px 0 0 6px;padding-left:14px}
.tl{position:relative;padding:0 0 12px;font-size:12px}.tl:before{content:"";position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--teal)}

.insp{display:grid;grid-template-columns:1fr 300px;gap:16px}

.chk{border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-bottom:7px;background:#fff}
.chk.fail{border-color:#efc5c9;background:#fffafa}.chk.pass{border-color:#cbe9d9}.chk.na{background:#fafbfc}
.chktop{display:flex;justify-content:space-between;gap:12px;align-items:center}.chk .t{font-weight:650;font-size:12.5px}.chk .m{font-size:11px;color:var(--muted);margin-top:2px}
.chk .note{margin-top:8px;display:none;gap:8px}.chk.fail .note{display:flex}.chk .note input{flex:1}
.insp aside{position:sticky;top:0;align-self:start}.bigscore{font-size:40px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.kanban{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow:auto}
.col{background:#eef2f6;border-radius:12px;padding:10px;min-height:320px}.col.over{outline:2px dashed var(--teal);outline-offset:-4px}
.colhead{display:flex;justify-content:space-between;font-size:12px;font-weight:700;padding:2px 4px 8px}
.kcard{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab;font-size:12px}
.kcard:hover{border-color:#a9c4d2}.kcard .id{font-size:10.5px;color:var(--muted);font-weight:700}
.kcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:7px;font-size:11px;color:var(--muted)}

.cal>div{border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-height:96px;padding:5px 6px;font-size:11px;min-width:0}

.cal .dn{font-weight:700;color:var(--muted);margin-bottom:3px;display:inline-block}.cal .today .dn{color:#fff;background:var(--teal);border-radius:10px;padding:0 6px}
.cal .offm{background:#fafbfc}.cal .offm .dn{color:#c2cbd4}
.ev{display:block;width:100%;text-align:left;border:0;border-radius:5px;padding:2px 5px;margin-bottom:3px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plans{grid-template-columns:repeat(3,1fr)}.plan{padding:18px}.plan.cur{border:2px solid var(--teal)}
.plan h3{margin:0}.plan .price{font-size:24px;font-weight:800;margin:6px 0}.plan ul{padding-left:18px;margin:10px 0 14px;color:var(--ink2);font-size:12.5px}
.integ{display:flex;gap:12px;align-items:center;padding:14px}.integ .logo{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:12px;flex:none}

.hbar{margin:11px 0}.hbar .ruleline{font-size:12px;margin-bottom:5px}
.flag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:5px;vertical-align:1px}
.heat td{text-align:center;font-weight:700;font-size:11.5px}.heat td:first-child{text-align:left;font-weight:600}

</head>
<body>

 log(`${a.id} submitted for ${l.name} · score ${a.score}% · ${a.findings.length} finding(s)${a.hardStop?' · HARD-STOP':''}`,a.inspector,SEEDING?date+'T17:30':null)}

const head=(e,t,s,a)=>`<div class="pagehead"><div><div class="eyebrow">${e}</div><h1>${t}</h1><div class="sub">${s}</div></div><div class="actions">${a||''}</div></div>`;
const kpi=(l,v,f,c)=>`<div class="card kpi ${c?'click':''}" ${c?`onclick="${c}"`:''}><div class="label">${l}</div><div class="value">${v}</div><div class="foot">${f}</div></div>`;
const sel=(opts,all,val,on)=>`<select class="in" onchange="${on}">${all?`<option value="">${all}</option>`:''}${opts.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
const scoreCell=v=>`<div class="scorecell"><div class="bar"><span style="width:${v??0}%;background:${scoreColor(v)}"></span></div><b>${pct(v)}</b></div>`;
function dueText(f){if(f.state==='Closed')return 'Closed '+fmt(f.closed);const d=daysFrom(f.due);return d<0?`<span class="down">${-d}d overdue</span>`:d===0?'<b>Due today</b>':`Due in ${d}d`}
const flags=f=>`${f.escalated?'<span class="flag bad">ESCALATED</span>':''}${f.containment==='Required'?'<span class="flag bad">CONTAIN</span>':''}${f.brandReview?'<span class="flag violet">BRAND REVIEW</span>':''}`;
function modal(html,wide){$('modal').className='modal'+(wide?' wide':'');$('modal').innerHTML=html;$('mb').classList.add('show')}
function closeModal(){$('mb').classList.remove('show')}
function drawer(title,sub,body,foot){$('drawer').innerHTML=`<div class="mhead"><div><h3>${title}</h3><div class="small muted">${sub||''}</div></div><button class="x" onclick="closeDrawer()">✕</button></div><div class="mbody" style="flex:1">${body}</div>${foot?`<div class="mfoot">${foot}</div>`:''}`;$('db').classList.add('show')}
function closeDrawer(){$('db').classList.remove('show')}
let FORM=null;
function formModal(o){FORM=o;const f=o.fields.map(x=>{const id='ff_'+x.k,v=x.val??'';let inp;
 if(x.type==='select')inp=`<select class="in" id="${id}" ${x.dis?'disabled':''}>${x.opts.map(op=>{const[val,lab]=Array.isArray(op)?op:[op,op];return `<option value="${esc(val)}" ${String(val)===String(v)?'selected':''}>${esc(lab)}</option>`}).join('')}</select>`;
 else if(x.type==='textarea')inp=`<textarea class="in" id="${id}" placeholder="${esc(x.ph||'')}">${esc(v)}</textarea>`;
 else inp=`<input class="in" id="${id}" type="${x.type||'text'}" value="${esc(v)}" placeholder="${esc(x.ph||'')}" ${x.dis?'disabled':''} ${x.min!=null?`min="${x.min}"`:''} ${x.max!=null?`max="${x.max}"`:''}>`;
 return `<div class="field ${x.span?'span2':''}"><label>${esc(x.label)}${x.req?' *':''}</label>${inp}${x.help?`<span class="small muted">${x.help}</span>`:''}</div>`}).join('');
 modal(`<div class="mhead"><h3>${esc(o.title)}</h3><button class="x" onclick="closeModal()">✕</button></div><div class="mbody">${o.intro||''}<div class="formgrid">${f}</div>${o.note?`<p class="small muted" style="margin:12px 0 0">${o.note}</p>`:''}</div><div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitForm()">${esc(o.submit||'Save')}</button></div>`);
 setTimeout(()=>{const el=document.querySelector('#modal .in:not([disabled])');el&&el.focus()},60)}
function submitForm(){const v={};let ok=true;FORM.fields.forEach(x=>{const el=$('ff_'+x.k);el.classList.remove('err');v[x.k]=x.type==='number'?Number(el.value):el.value.trim();if(x.req&&!el.value.trim()){ok=false;el.classList.add('err')}});if(!ok)return toast('Complete the required fields.','warn');const r=FORM.onSave(v);if(r===false||r==='keep')return;closeModal()}
const noteModal=(title,label,cb,ph)=>formModal({title,fields:[{k:'t',label,type:'textarea',req:true,span:true,ph}],submit:'Confirm',onSave:v=>{cb(v.t)}});
function confirmModal(title,msg,cb,btn='Confirm'){modal(`<div class="mhead"><h3>${title}</h3><button class="x" onclick="closeModal()">✕</button></div><div class="mbody">${msg}</div><div class="mfoot"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="cfm">${btn}</button></div>`);$('cfm').onclick=()=>{closeModal();cb()}}
function upsell(msg){modal(`<div class="mhead"><h3>Plan limit reached</h3><button class="x" onclick="closeModal()">✕</button></div><div class="mbody"><div class="callout warn">${msg}</div><p class="small muted">You are on the <b>${S.org.plan}</b> plan. Upgrade to raise location, user and AI-review limits.</p></div><div class="mfoot"><button class="btn" onclick="closeModal()">Not now</button><button class="btn primary" onclick="closeModal();go('settings','billing')">View plans</button></div>`)}
function dl(name,content,type){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Download prepared: '+name,'ok')}catch(e){toast('Download blocked by the browser.','warn')}}
function csv(name,rows){if(!need('export'))return;if(!rows.length)return toast('Nothing to export.','warn');const k=Object.keys(rows[0]);dl(name+'.csv',[k.join(','),...rows.map(r=>k.map(x=>'"'+String(r[x]??'').replace(/"/g,'""')+'"').join(','))].join('\n'),'text/csv')}
function exp(t){if(t==='locations')csv('locations',S.locations.map(l=>({Code:l.id,Name:l.name,City:l.city,Region:l.region,Format:l.format,Manager:l.manager,Frequency:l.freq,StandardSet:l.set,Score:l.score??'',LastAudit:l.last||'',State:locState(l)})));
 if(t==='findings')csv('findings',fndList().map(f=>({ID:f.id,Finding:f.title,Location:loc_(f.loc).name,Standard:f.std,Severity:f.severity,Owner:f.owner,Due:f.due,State:f.state,Escalated:f.escalated?'Yes':'No',Source:f.source,Created:f.created,Closed:f.closed||''})));
 if(t==='standards')csv('standards',S.standards.map(s=>({ID:s.id,Requirement:s.title,Category:s.category,AppliesTo:s.applies,Evidence:s.evidence,Severity:s.severity,Weight:s.weight,Version:s.version,Status:s.status,Criteria:s.criteria})));
 if(t==='audits')csv('inspections',S.audits.map(a=>({ID:a.id,Location:loc_(a.loc).name,Type:a.type,Inspector:a.inspector,Due:a.due,Status:a.status,Score:a.score??'',Findings:a.findings.length,Completed:a.completed||'',Campaign:a.campaign||''})))}

 return{avg:sc.length?sc.reduce((a,b)=>a+b,0)/sc.length:0,open:open.length,crit:open.filter(f=>f.severity==='Critical').length,over:open.filter(f=>daysFrom(f.due)<0).length,esc:open.filter(f=>f.escalated).length,await:open.filter(f=>f.state==='Awaiting Verification').length,contain:open.filter(f=>f.containment==='Required').length,due7:pend.filter(a=>daysFrom(a.due)<=7).length,audOver:pend.filter(a=>daysFrom(a.due)<0).length,inprog:pend.filter(a=>a.status==='In Progress').length,sched:pend.filter(a=>a.status==='Scheduled').length}}
function notifs(){const n=[];S.findings.filter(f=>f.state!=='Closed').forEach(f=>{const l=loc_(f.loc),d=daysFrom(f.due);if(f.containment==='Required')n.push(['bad',`Containment required · ${f.id}`,`${l.name} · ${f.title}`,`openF('${f.id}')`]);else if(d<0)n.push(['risk',`Action overdue by ${-d}d · ${f.id}`,`${l.name} · owner ${f.owner}`,`openF('${f.id}')`]);if(f.state==='Awaiting Verification'&&can('verify'))n.push(['violet',`Awaiting your verification · ${f.id}`,`${l.name} · ${f.title}`,`openF('${f.id}')`])});
 S.audits.filter(a=>a.status!=='Completed'&&daysFrom(a.due)<0).forEach(a=>n.push(['risk',`Inspection overdue · ${a.id}`,`${loc_(a.loc).name} · ${a.type}`,`openInsp('${a.id}')`]));return n}

 $('nav').innerHTML=NAV.map(([g,items])=>`<div class="navlabel">${g}</div>`+items.map(([id,ic,t])=>`<button class="${UI.page===id?'active':''}" onclick="go('${id}')"><span class="ico">${ic}</span>${t}${id==='findings'&&k.crit?`<span class="cnt">${k.crit}</span>`:''}</button>`).join('')).join('');
 $('orgAv').textContent=initials(S.org.name);$('orgName').textContent=S.org.name;$('orgPlan').textContent=S.org.plan+' plan · '+S.locations.length+' locations';

 $('sidefoot').innerHTML=p.id==='Enterprise'?`Enterprise plan · unlimited<br><span class="small">Data stored in this browser (demo tenant)</span>`:`Locations ${S.locations.length} / ${p.loc}<div class="meter"><span style="width:${lp}%"></span></div>AI reviews ${S.org.aiUsed} / ${p.ai} this month<div class="meter"><span style="width:${ap}%"></span></div><a onclick="go('settings','billing')">Upgrade plan →</a><div style="margin-top:8px">Demo tenant · data stored in this browser</div>`;
 $('crumb').innerHTML=`${esc(S.org.name)} &nbsp;/&nbsp; <b>${TITLES[UI.page]}</b>`;$('planPill').textContent=S.org.plan.toUpperCase()+' PLAN';
 $('meAv').textContent=initials(m.name);$('meName').textContent=m.name;$('meRole').textContent=m.role;
 const n=notifs().length;$('notifCount').textContent=n;$('notifCount').style.display=n?'block':'none'}
function toggleDD(id){const el=$(id),show=!el.classList.contains('show');document.querySelectorAll('.dd').forEach(d=>d.classList.remove('show'));if(!show)return;
 if(id==='notifDD'){const n=notifs();el.innerHTML=`<div class="ddhead">Notifications · ${n.length}</div>`+(n.map(([c,t,s,a])=>`<button class="dditem" onclick="${a};toggleDD('notifDD')"><span class="alertdot" style="background:var(--${c==='bad'?'red':c==='violet'?'violet':'amber'})"></span><span><b>${esc(t)}</b><small>${esc(s)}</small></span></button>`).join('')||'<div class="empty">You are all caught up.</div>')}
 if(id==='userDD'){const m=me();el.innerHTML=`<div class="ddhead">Signed in as</div><div class="dditem" style="cursor:default"><span class="avatar">${initials(m.name)}</span><span><b>${esc(m.name)}</b><small>${esc(m.email)} · ${m.role}</small></span></div><div class="ddhead">Switch user · demo roles</div>`+S.users.filter(u=>u.status==='Active').map(u=>`<button class="dditem" onclick="switchUser('${u.id}')"><span class="avatar">${initials(u.name)}</span><span><b>${esc(u.name)}${u.id===m.id?' ✓':''}</b><small>${u.role} — ${ROLE_DESC[u.role]}</small></span></button>`).join('')+`<div class="ddhead">Account</div><button class="dditem" onclick="go('settings','org');toggleDD('userDD')">⚙ Organisation settings</button><button class="dditem" onclick="go('settings','data');toggleDD('userDD')">⟲ Backup / reset demo data</button>`}
 el.classList.add('show')}

function gsearch(){const q=$('gs').value.trim().toLowerCase(),dd=$('gsDD');if(q.length<2){dd.classList.remove('show');return}const r=[];
 S.locations.forEach(l=>{if((l.name+' '+l.id+' '+l.city+' '+l.manager).toLowerCase().includes(q))r.push(['Location',l.name,`${l.id} · ${l.city} · ${l.format}`,`openLoc('${l.id}')`])});
 S.findings.forEach(f=>{if((f.id+' '+f.title+' '+f.owner).toLowerCase().includes(q))r.push(['Finding',`${f.id} · ${f.title}`,`${loc_(f.loc).name} · ${f.state}`,`openF('${f.id}')`])});
 S.audits.forEach(a=>{if((a.id+' '+a.type+' '+loc_(a.loc).name).toLowerCase().includes(q))r.push(['Inspection',`${a.id} · ${a.type}`,`${loc_(a.loc).name} · ${a.status}`,a.status==='Completed'?`openReport('${a.id}')`:`openInsp('${a.id}')`])});
 S.standards.forEach(s=>{if((s.id+' '+s.title+' '+s.category).toLowerCase().includes(q))r.push(['Standard',`${s.id} · ${s.title}`,`${s.category} · v${s.version}`,`openStd('${s.id}')`])});
 dd.innerHTML=r.slice(0,12).map(([t,a,b,c])=>`<button class="dditem" onclick="${c};$('gs').value='';$('gsDD').classList.remove('show')"><span class="chip">${t}</span><span><b>${esc(a)}</b><small>${esc(b)}</small></span></button>`).join('')||'<div class="empty">No matches</div>';dd.classList.add('show')}

const PAGES={};

/* ---------- Control Tower ---------- */
PAGES.overview=()=>{const k=K(),m=me(),prev=S.org.trend[S.org.trend.length-1],dl_=k.avg-prev,h=new Date().getHours();
 const pri=S.findings.filter(f=>f.state!=='Closed'&&(f.severity==='Critical'||daysFrom(f.due)<0||f.escalated)).sort((a,b)=>SEVS.indexOf(a.severity)-SEVS.indexOf(b.severity)||a.due.localeCompare(b.due));
 const months=[];for(let i=S.org.trend.length;i>=0;i--){const d=new Date(TODAY);d.setDate(1);d.setMonth(d.getMonth()-i);months.push(d.toLocaleDateString('en-GB',{month:'short'}))}
 const ranked=[...S.locations].sort((a,b)=>(b.score??-1)-(a.score??-1));
 const open=S.findings.filter(f=>f.state!=='Closed');
 const recent=S.audits.filter(a=>a.status==='Completed').sort((a,b)=>b.completed.localeCompare(a.completed)).slice(0,6);
 return head('Visual standards intelligence',`${h<12?'Good morning':h<17?'Good afternoon':'Good evening'}, ${esc(m.name.split(' ')[0])}`,`One operating view of brand presentation, store readiness, customer-facing displays and safety conditions across ${S.locations.length} locations.`,`<button class="btn" onclick="campaignForm()">＋ New campaign</button><button class="btn primary" onclick="auditForm()">＋ Start inspection</button>`)
 +setupCard()
 +`<div class="grid kpis">${kpi('Locations monitored',S.locations.length,`${uniq(S.locations.map(l=>l.format)).length} formats · ${uniq(S.locations.map(l=>l.region)).length} regions`,"go('locations')")}${kpi('Network compliance',pct(k.avg),`<span class="${dl_>=0?'up':'down'}">${dl_>=0?'▲':'▼'} ${Math.abs(dl_).toFixed(1)} pts</span> vs last cycle`,"go('analytics')")}${kpi('Open critical findings',pad(k.crit),`${k.contain} need containment`,"fFilter({sev:'Critical'})")}${kpi('Inspections due · 7 days',pad(k.due7),`<span class="${k.audOver?'down':''}">${k.audOver} overdue</span> · ${k.inprog} in progress`,"go('audits','list')")}${kpi('Overdue actions',pad(k.over),`${k.esc} escalated · ${k.await} awaiting verification`,"fFilter({st:'Overdue'})")}</div>
 <div class="grid dash"><div class="card panel"><div class="panelhead"><h3>Network compliance trend</h3><span class="chip">Target ${S.org.good}%</span></div>${lineChart([...S.org.trend,k.avg],months,S.org.good)}</div>
 <div class="card panel"><div class="panelhead"><h3>Priority attention</h3><span class="badge ${pri.length?'bad':'good'}">${pri.length} items</span></div>${pri.slice(0,5).map(f=>`<div class="alert" onclick="openF('${f.id}')"><span class="alertdot" style="background:${f.severity==='Critical'?'#c4474e':'#d4962f'}"></span><div><strong>${esc(f.title)} · ${esc(loc_(f.loc).name)}</strong><p>${f.severity} · ${f.id} · ${dueText(f)}${f.escalated?' · Escalated':''}${f.containment==='Required'?' · Containment required':''}</p></div></div>`).join('')||'<div class="empty">No priority items. 🎉</div>'}${pri.length>5?`<button class="btn sm" onclick="fFilter({st:'Overdue'})">View all →</button>`:''}</div></div>
 <div class="grid dash section"><div class="card panel"><div class="panelhead"><h3>Location compliance ranking</h3><button class="btn sm" onclick="go('locations')">All locations →</button></div>${ranked.map(l=>`<div class="site-row" onclick="openLoc('${l.id}')"><div><div class="site-name">${esc(l.name)} ${badge(locState(l))}</div><div class="site-meta">${l.format} · ${esc(l.city)} · ${l.region}</div></div><div class="bar"><span style="width:${l.score??0}%;background:${scoreColor(l.score)}"></span></div><div class="score">${l.score==null?'—':l.score.toFixed(1)+'%'}</div></div>`).join('')}</div>
 <div class="card panel"><div class="panelhead"><h3>Corrective action pipeline</h3><button class="btn sm" onclick="UI.fnd.view='board';go('findings')">Board →</button></div>${STATES.map(s=>{const n=s==='Closed'?S.findings.filter(f=>f.state==='Closed'&&f.closed&&daysFrom(f.closed)>=-30).length:open.filter(f=>f.state===s).length,mx=Math.max(1,S.findings.length/2);return `<div class="hbar" style="cursor:pointer" onclick="fFilter({st:'${s}'})"><div class="ruleline"><span>${s}${s==='Closed'?' <span class="muted">(30 days)</span>':''}</span><b>${n}</b></div><div class="progress"><span style="width:${Math.min(100,n/mx*100)}%;background:${s==='Open'?'#c4474e':s==='In Progress'?'#d4962f':s==='Closed'?'#1a8a6a':'#6b4fbb'}"></span></div></div>`}).join('')}
 <h4 class="h4">Open by severity</h4><div style="display:flex;gap:8px">${SEVS.map(s=>`<div class="tile" style="flex:1;cursor:pointer" onclick="fFilter({sev:'${s}'})"><strong>${open.filter(f=>f.severity===s).length}</strong><span>${s}</span></div>`).join('')}</div></div></div>
 <div class="section"><div class="grid quickgrid"><button class="quick" onclick="locForm()"><span class="qico">⌖</span><span><strong>Register location</strong><small>Add a store or outlet</small></span></button><button class="quick" onclick="stdForm()"><span class="qico">▤</span><span><strong>Create standard</strong><small>Define a visual requirement</small></span></button><button class="quick" onclick="campaignForm()"><span class="qico">◷</span><span><strong>Launch campaign</strong><small>Schedule multi-site inspections</small></span></button><button class="quick" onclick="go('ai')"><span class="qico">✧</span><span><strong>Review photos with AI</strong><small>Assisted visual assessment</small></span></button></div></div>
 <div class="section card panel"><div class="panelhead"><h3>Latest inspection results</h3><button class="btn sm" onclick="go('audits','list')">All inspections →</button></div><div class="tablewrap"><table><thead><tr><th>Inspection</th><th>Location</th><th>Type</th><th>Completed</th><th>Score</th><th>Findings</th><th>Result</th></tr></thead><tbody>${recent.map(a=>`<tr class="rowlink" onclick="openReport('${a.id}')"><td><b>${a.id}</b></td><td>${esc(loc_(a.loc).name)}</td><td>${a.type}</td><td>${fmt(a.completed)}</td><td>${scoreCell(a.score)}</td><td>${a.findings.length}</td><td>${a.hardStop?badge('Critical'):badge(a.score>=S.org.good?'Good':a.score>=S.org.watch?'Watch':'Critical')}</td></tr>`).join('')}</tbody></table></div></div>`};
function setupCard(){if(S.setupHidden)return '';const st=[['Register locations',S.locations.length>0,"go('locations')"],['Publish standards',S.standards.some(s=>s.status==='Published'),"go('standards')"],['Complete an inspection',S.audits.some(a=>a.status==='Completed'),"go('audits','list')"],['Invite your team',S.users.length>4,"go('settings','users')"],['Connect your ERP',S.integrations.erpnext||S.integrations.odoo,"go('settings','integrations')"]],d=st.filter(x=>x[1]).length;
 return `<div class="card setup"><div><div class="eyebrow">Workspace setup</div><h3 style="margin:4px 0">${d} of ${st.length} steps complete</h3><div class="progress"><span style="width:${d/st.length*100}%"></span></div><button class="btn sm" style="margin-top:10px" onclick="S.setupHidden=true;commit()">Hide</button></div><div class="steps">${st.map(([t,ok,a],i)=>`<button class="step ${ok?'done':''}" onclick="${a}"><b>${ok?'✓':i+1+'.'} ${t}</b>${ok?'Done':'Start →'}</button>`).join('')}</div></div>`}
function lineChart(vals,labels,target){const W=600,H=200,pl=34,pr=14,pt=18,pb=26,mn=Math.floor(Math.min(...vals,target)-3),mx=Math.ceil(Math.max(...vals,target)+2),x=i=>pl+i*(W-pl-pr)/(vals.length-1),y=v=>pt+(mx-v)/(mx-mn)*(H-pt-pb);let g='';
 for(let t=0;t<=4;t++){const v=mn+(mx-mn)*t/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eef2f6"/><text x="${pl-6}" y="${y(v)+3}" text-anchor="end" font-size="10" fill="#8a97a6">${v.toFixed(0)}</text>`}
 const pts=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' '),L=vals.length-1;

function previewImage(e){const f=e.target.files&&e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Please choose an image file.','warn');const r=new FileReader();r.onload=ev=>{AIIMG=ev.target.result;$('photo').innerHTML=`<img src="${AIIMG}" alt="Evidence">`};r.readAsDataURL(f)}
function runAI(){if(!need('ai'))return;if(!AIIMG)return toast('Add a photo before running the review.','warn');if(S.org.aiUsed>=planOf().ai)return upsell('Monthly Visual AI review limit reached.');S.org.aiUsed++;save();renderChrome();const prof=$('aiProfile').value,loc=$('aiLoc').value;$('aiState').textContent='Analysing…';$('aiOut').className='';$('aiOut').innerHTML='<div class="empty">⏳ Running visual checks against the “'+esc(prof)+'” profile…</div>';
 setTimeout(()=>{AIRES=AISUG[prof].map(([t,s,c,d])=>({t,s,c,d,loc,done:null}));$('aiState').textContent='Complete · human review required';drawAI();log(`Visual AI review run for ${loc_(loc).name} (${prof})`);save()},900)}
function drawAI(){$('aiOut').innerHTML=`<div class="tile" style="margin-bottom:12px"><strong>${AIRES.length} suggestions</strong><span>Illustrative output · no live model call</span></div>`+AIRES.map((r,i)=>{const c=r.c>=80?'#c4474e':r.c>=65?'#d4962f':'#8a97a6';return `<div class="rulecard"><div class="ruleline"><b>${esc(r.t)}</b><span class="badge neutral">${r.c}% confidence</span></div><div class="conf"><span style="width:${r.c}%;background:${c}"></span></div><p>${esc(r.d)}</p><div class="ruleline"><span class="small muted">Maps to ${r.s} · ${esc(std_(r.s)?.title||'')}</span><span>${r.done?`<span class="badge ${r.done==='Dismissed'?'neutral':'good'}">${r.done}</span>`:`<button class="btn sm" onclick="aiAct(${i},false)">Dismiss</button> <button class="btn sm primary" onclick="aiAct(${i},true)">＋ Confirm finding</button>`}</span></div></div>`}).join('')+'<div class="callout warn">Do not use simulated output to certify fire safety, accessibility, hygiene or statutory compliance.</div>'}
function aiAct(i,ok){const r=AIRES[i];if(!ok){r.done='Dismissed';return drawAI()}if(!need('finding'))return;const s=std_(r.s),l=loc_(r.loc);const f=newFinding({title:r.t,loc:r.loc,std:r.s,severity:s.severity,source:'AI suggestion (human-confirmed)',created:today(),by:me().name});f.history[0].at=stamp();f.history.push({at:stamp(),by:me().name,text:`Confirmed by reviewer · model confidence ${r.c}%`});applyRules(f,s,l,null);r.done='✓ '+f.id;log(`${f.id} created from AI suggestion at ${l.name}`);save();renderChrome();drawAI();toast(`${f.id} created for human verification.`,'ok')}

PAGES.analytics=()=>{const lat=Object.values(latestByLoc()),cs=catStats(lat),open=S.findings.filter(f=>f.state!=='Closed'),closed=S.findings.filter(f=>f.state==='Closed'&&f.closed);
 const grp=key=>uniq(S.locations.map(l=>l[key])).map(g=>{const ls=S.locations.filter(l=>l[key]===g&&l.score!=null);return[g,ls.length?ls.reduce((a,l)=>a+l.score,0)/ls.length:null,ls.length]}).sort((a,b)=>(b[1]??0)-(a[1]??0));
 const hot={};S.findings.forEach(f=>hot[f.std]=(hot[f.std]||0)+1);const hots=Object.entries(hot).sort((a,b)=>b[1]-a[1]).slice(0,6);
 const ttc=SEVS.map(s=>{const c=closed.filter(f=>f.severity===s);return[s,c.length?c.reduce((a,f)=>a+Math.max(0,diff(f.closed,f.created)),0)/c.length:null]});
 const hb=(n,v,c,lab)=>`<div class="hbar"><div class="ruleline"><span>${n}</span><b>${lab??pct(v)}</b></div><div class="progress"><span style="width:${v??0}%;background:${c||scoreColor(v)}"></span></div></div>`;
 return head('Performance intelligence','Network Performance','Where standards fail, which requirements create repeat findings and how quickly locations recover. All figures are computed live from inspection data.',`<button class="btn" onclick="exp('audits')">↓ Inspection data</button><button class="btn" onclick="exp('findings')">↓ Findings data</button>`)
 +`<div class="grid two"><div class="card panel"><div class="panelhead"><h3>Compliance by category</h3><span class="chip">Latest inspection per location</span></div>${CATS.map(c=>{const x=cs[c],v=x.p+x.f?x.p/(x.p+x.f)*100:null;return hb(c,v)}).join('')}</div>
 <div class="card panel"><div class="panelhead"><h3>Open findings by severity</h3><span class="chip">${open.length} open</span></div>${SEVS.map(s=>{const n=open.filter(f=>f.severity===s).length;return hb(s,open.length?n/open.length*100:0,s==='Critical'?'#c4474e':s==='Major'?'#d4962f':'#2f66b3',n)}).join('')}<p class="small muted">Severity comes from the configured business impact of the standard, never from AI confidence alone.</p></div></div>
 <div class="section card panel"><div class="panelhead"><h3>Location × category heatmap</h3><span class="chip">Pass rate (weighted) · latest inspection</span></div><div class="tablewrap"><table class="heat"><thead><tr><th>Location</th>${CATS.map(c=>`<th style="text-align:center">${c}</th>`).join('')}<th style="text-align:center">Overall</th></tr></thead><tbody>${S.locations.map(l=>{const a=lat.find(x=>x.loc===l.id),c=a?catStats([a]):null;return `<tr class="rowlink" onclick="openLoc('${l.id}')"><td>${esc(l.name)}</td>${CATS.map(k=>{const x=c?.[k],v=x&&x.p+x.f?x.p/(x.p+x.f)*100:null;return `<td style="background:${v==null?'#fafbfc':v>=S.org.good?'#e6f6ee':v>=S.org.watch?'#fff4e2':'#fdeeee'};color:${v==null?'#b6c0ca':scoreColor(v)}">${v==null?'—':v.toFixed(0)+'%'}</td>`}).join('')}<td style="color:${scoreColor(l.score)}">${pct(l.score)}</td></tr>`}).join('')}</tbody></table></div></div>
 <div class="section grid three"><div class="card panel"><h3 style="margin:0 0 6px;font-size:14px">By region</h3>${grp('region').map(([g,v,n])=>hb(`${g} <span class="muted">(${n})</span>`,v)).join('')}</div>
 <div class="card panel"><h3 style="margin:0 0 6px;font-size:14px">By format</h3>${grp('format').map(([g,v,n])=>hb(`${g} <span class="muted">(${n})</span>`,v)).join('')}</div>
 <div class="card panel"><h3 style="margin:0 0 6px;font-size:14px">Average days to close</h3>${ttc.map(([s,v])=>`<div class="mini"><span>${s} <span class="small">(SLA ${SLA[s]}d)</span></span><b class="${v!=null&&v>SLA[s]?'down':''}">${v==null?'—':v.toFixed(1)+' days'}</b></div>`).join('')}<h4 class="h4">Repeat hotspots (all time)</h4>${hots.map(([sid,n])=>`<div class="mini rowlink" onclick="openStd('${sid}')"><span>${sid} · ${esc(std_(sid)?.title||'')}</span><b>${n}</b></div>`).join('')}</div></div>`};
function latestByLoc(){const m={};S.audits.filter(a=>a.status==='Completed').forEach(a=>{if(!m[a.loc]||a.completed>m[a.loc].completed)m[a.loc]=a});return m}
function catStats(aus){const c={};CATS.forEach(k=>c[k]={p:0,f:0});aus.forEach(a=>Object.entries(a.results).forEach(([sid,r])=>{const s=std_(sid);if(!s||r.r==='na'||!c[s.category])return;c[s.category][r.r==='pass'?'p':'f']+=s.weight}));return c}

 return head('Configuration workbench','Rules & Scoring','Configure how failures are escalated, which SLAs apply and when containment is mandatory. Rules run automatically every time a finding is raised.',`<button class="btn" onclick="validateRules()">✓ Validate rules</button><button class="btn primary" onclick="ruleForm()">＋ Add rule</button>`)
 +`<div class="grid dash"><div class="card panel"><div class="panelhead"><h3>Validation & escalation rules</h3><span class="badge good">${S.rules.filter(r=>r.enabled).length} enabled</span></div>${S.rules.map(r=>{const hits=S.findings.filter(f=>f.rules.includes(r.id)).length;return `<div class="rulecard ${r.enabled?'':'off'}"><div class="ruleline"><b>${r.id} · ${esc(r.name)}</b><label class="switch"><input type="checkbox" ${r.enabled?'checked':''} onchange="toggleRule('${r.id}',this.checked)"><span></span></label></div><p><b>When:</b> ${TRIGGERS[r.trigger]}${r.trigger==='category'?` (${r.category})`:''} &nbsp;→&nbsp; <b>Then:</b> ${ACTIONS[r.action]}${r.sla?` · SLA ${r.sla} day(s)`:''}</p><div class="ruleline"><span class="small muted">Applies: ${r.applies} · ${hits} finding(s) affected${r.system?' · system rule':''}</span>${r.system?'':`<span><button class="btn sm" onclick="ruleForm('${r.id}')">Edit</button> <button class="btn sm danger" onclick="delRule('${r.id}')">Delete</button></span>`}</div></div>`}).join('')}</div>
 <div><div class="card panel"><h3 style="margin:0 0 4px;font-size:14px">Scoring model</h3><p class="small muted" style="margin-top:0">Score = passed weight ÷ (passed + failed weight). N/A excluded. Shares below are derived from published standard weights.</p>${CATS.map(c=>{const w=pub.filter(s=>s.category===c).reduce((a,s)=>a+s.weight,0);return `<div class="hbar"><div class="ruleline"><span>${c}</span><b>${tot?(w/tot*100).toFixed(1):0}% · ${w} pts</b></div><div class="progress"><span style="width:${tot?w/tot*100:0}%"></span></div></div>`}).join('')}</div>
 <div class="card panel section"><h3 style="margin:0 0 6px;font-size:14px">Thresholds & SLAs</h3><div class="mini"><span>Good</span><b>≥ ${S.org.good}%</b></div><div class="mini"><span>Watch</span><b>${S.org.watch}% – ${S.org.good}%</b></div><div class="mini"><span>Critical</span><b>&lt; ${S.org.watch}% or any open critical finding</b></div>${SEVS.map(s=>`<div class="mini"><span>${s} SLA</span><b>${SLA[s]} day(s)</b></div>`).join('')}<button class="btn sm" style="margin-top:8px" onclick="go('settings','org')">Edit thresholds →</button></div></div></div>
 <div class="section card panel"><h3 style="margin:0 0 10px;font-size:14px">Industry configuration examples</h3><div class="tablewrap"><table><thead><tr><th>Industry format</th><th>Visual controls</th><th>Special validation</th><th>Responsible role</th></tr></thead><tbody><tr><td><b>Retail store</b></td><td>Window display, planogram, price labels, campaign graphics</td><td>Price and promotion dates match POS / campaign master</td><td>Store manager / VM lead</td></tr><tr><td><b>Restaurant / QSR</b></td><td>Menu boards, counter display, hygiene visibility, queue signage</td><td>Menu price, allergen notice and campaign match approved menu version</td><td>Outlet manager / Food safety lead</td></tr><tr><td><b>Hotel / hospitality</b></td><td>Reception, room presentation, directional signs, amenities</td><td>Standards vary by property category</td><td>Property manager / Housekeeping</td></tr><tr><td><b>Franchise</b></td><td>Brand kit, uniforms, fixtures, approved collateral</td><td>Local exceptions need franchisor approval and expiry</td><td>Franchise operations</td></tr></tbody></table></div></div>`};
function toggleRule(id,on){if(!need('rule'))return render();const r=S.rules.find(x=>x.id===id);r.enabled=on;log(`Rule ${id} ${on?'enabled':'disabled'}`);commit(`${id} ${on?'enabled':'disabled'}. Applies to new findings.`,'ok')}
function ruleForm(id){if(!need('rule'))return;const r=id?S.rules.find(x=>x.id===id):null;formModal({title:r?`Edit ${r.id}`:'Add rule',fields:[{k:'name',label:'Rule name',req:true,span:true,val:r?.name,ph:'e.g. Missing allergen notice in restaurants'},{k:'trigger',label:'When',type:'select',opts:Object.entries(TRIGGERS),val:r?.trigger},{k:'category',label:'Category (for category trigger)',type:'select',opts:CATS,val:r?.category},{k:'action',label:'Then',type:'select',opts:Object.entries(ACTIONS),val:r?.action||'escalate'},{k:'sla',label:'SLA override (days, 0 = none)',type:'number',min:0,max:30,val:r?.sla??0},{k:'applies',label:'Applies to',type:'select',opts:APPLIES,val:r?.applies}],note:'Rules apply to findings raised after saving. Shortest SLA wins when several rules match.',submit:r?'Save rule':'Add rule',
 onSave:v=>{const o={name:v.name,trigger:v.trigger,category:v.trigger==='category'?v.category:'',action:v.action,sla:Math.max(0,v.sla||0),applies:v.applies};if(r){Object.assign(r,o);log(`Rule ${r.id} edited`);return commit('Rule updated.','ok')}const nid='VC-R'+String(++S.seq.rule).padStart(3,'0');S.rules.push({id:nid,...o,enabled:true,system:false});log(`Rule ${nid} created`);commit(`${nid} added and enabled.`,'ok')}})}

function validateRules(){const issues=[];const en=S.rules.filter(r=>r.enabled);if(!en.some(r=>r.action==='hardstop'))issues.push('No hard-stop rule is enabled — critical safety failures will not force containment.');const sig={};en.forEach(r=>{const k=r.trigger+r.category+r.action+r.applies;if(sig[k])issues.push(`${r.id} duplicates ${sig[k]}.`);sig[k]=r.id});if(S.standards.some(s=>s.status==='Published'&&s.severity==='Critical'&&s.category!=='Safety'))issues.push('Note: some Critical standards are outside Safety — hard-stop applies to them too.');modal(`<div class="mhead"><h3>Rule validation</h3><button class="x" onclick="closeModal()">✕</button></div><div class="mbody">${issues.length?issues.map(i=>`<div class="callout ${i.startsWith('Note')?'':'warn'}">${i}</div>`).join(''):'<div class="callout">✓ No blocking conflicts found.</div>'}<p class="small muted">${en.length} enabled rules checked.</p></div><div class="mfoot"><button class="btn primary" onclick="closeModal()">Done</button></div>`)}

SET.integrations=()=>`<div class="grid two">${INTEG.map(([k,n,c,ab,d,ent])=>`<div class="card integ"><div class="logo" style="background:${c}">${ab}</div><div class="t"><b>${n} ${ent&&S.org.plan!=='Enterprise'?'<span class="chip">Enterprise</span>':''}</b><span class="small muted">${d}</span></div>${S.integrations[k]?'<span class="badge good">Connected</span>':''}<label class="switch"><input type="checkbox" ${S.integrations[k]?'checked':''} onchange="setInteg('${k}',this.checked,${ent?1:0})"><span></span></label></div>`).join('')}</div><div class="callout section">ERP connector design: Locations ↔ Branch / Warehouse master · Findings → Issue / Task with owner & due date · Closure status synced back. Credentials are stored per tenant (server-side in production).</div>`;
function setInteg(k,on,ent){if(!need('settings'))return render();if(on&&ent&&S.org.plan!=='Enterprise'){render();return upsell('This integration requires the Enterprise plan.')}S.integrations[k]=on;const n=INTEG.find(x=>x[0]===k)[1];log(`${n} ${on?'connected':'disconnected'}`);commit(`${n} ${on?'connected (demo)':'disconnected'}.`,'ok')}
SET.trail=()=>`<div class="card panel"><div class="panelhead"><h3>Audit trail</h3><span class="chip">${S.activity.length} events</span></div><div class="tablewrap"><table><thead><tr><th>When</th><th>User</th><th>Event</th></tr></thead><tbody>${S.activity.slice(0,150).map(a=>`<tr><td style="white-space:nowrap">${fmtTS(a.at)}</td><td>${esc(a.by)}</td><td>${esc(a.text)}</td></tr>`).join('')}</tbody></table></div></div>`;
SET.data=()=>`<div class="grid three"><div class="card panel"><h3 style="margin:0 0 6px;font-size:14px">Backup</h3><p class="small muted">Download the full workspace (locations, standards, inspections, findings, rules) as JSON.</p><button class="btn primary" onclick="dl('visualcompliance_backup_${today()}.json',JSON.stringify(S,null,2),'application/json')">↓ Download backup</button></div><div class="card panel"><h3 style="margin:0 0 6px;font-size:14px">Restore</h3><p class="small muted">Restore a workspace from a previously downloaded JSON backup.</p><label class="btn">↑ Choose backup file<input type="file" accept="application/json" hidden onchange="restore(this.files[0])"></label></div><div class="card panel"><h3 style="margin:0 0 6px;font-size:14px">Reset demo</h3><p class="small muted">Discard all changes and reload the sample workspace.</p><button class="btn danger" onclick="confirmModal('Reset demo data','All changes in this browser will be lost.',()=>{S=seed();save();UI.page='overview';render();toast('Demo data reset.','ok')},'Reset')">⟲ Reset demo data</button></div></div><div class="callout section">This prototype stores data in your browser only. Production: multi-tenant database, role-based API, encrypted image storage and per-tenant backups.</div>`;
function restore(file){if(!file||!need('settings'))return;const r=new FileReader();r.onload=e=>{try{const o=JSON.parse(e.target.result);if(o.v!==3||!Array.isArray(o.locations)||!Array.isArray(o.findings))throw 0;S=o;commit('Workspace restored.','ok')}catch(x){toast('Invalid backup file.','warn')}};r.readAsText(file)}

/* ===================== Boot ===================== */
document.addEventListener('click',e=>{if(!e.target.closest('.rel'))document.querySelectorAll('.dd').forEach(d=>d.classList.remove('show'))});
$('mb').addEventListener('click',e=>{if(e.target===$('mb')&&!$('modal').classList.contains('wide'))closeModal()});
$('db').addEventListener('click',e=>{if(e.target===$('db'))closeDrawer()});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('gs').focus()}if(e.key==='Escape'){document.querySelectorAll('.dd').forEach(d=>d.classList.remove('show'));if($('mb').classList.contains('show'))closeModal();else closeDrawer()}});
S=load()||seed();save();render();
</script>
</body>
</html>
